# Runtime/dependency pins and the lock are owned by ai/framework/pyproject.toml and uv.lock.
[tool.ruff]
required-version = "==0.17.1"
line-length = 100
target-version = "py314"
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["test_reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-p", "no:cacheprovider"]
markers = ["integration: owned disposable wrapper/process checks", "acceptance: separately requested full application acceptance"]
